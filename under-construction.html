<!DOCTYPE html>
<!--
  Temporary "under construction" page. vercel.json redirects every route here.
  To bring the full site back: delete the "redirects" block in vercel.json.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kei Events | Under Construction</title>
  <meta name="description" content="Kei Events is building a brand-new website. Check back soon!">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/assets/img/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=DM+Sans:wght@400;500;600&display=swap">

  <style>
    :root {
      --kei-red: #E63946;
      --kei-blue: #1D4ED8;
      --kei-blue-dark: #1e3a8a;
      --kei-yellow: #FACC15;
      --kei-yellow-light: #fefce8;
      --ink: #0f1419;
      --muted: #4b5563;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "DM Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: var(--kei-yellow-light);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      min-height: 100vh;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: #fff;
      border-radius: 24px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 1px 0 rgba(15,20,25,.06), 0 20px 50px -20px rgba(15,20,25,.25);
      border-top: 8px solid var(--kei-yellow);
    }
    .logo { width: 120px; height: auto; margin: 0 auto 20px; display: block; }
    .tape {
      display: inline-block;
      background: repeating-linear-gradient(-45deg, var(--kei-yellow) 0 14px, var(--ink) 14px 28px);
      height: 14px;
      width: 100%;
      border-radius: 4px;
      margin-bottom: 24px;
    }
    h1 {
      font-family: "Caveat", cursive;
      font-weight: 700;
      font-size: clamp(2.5rem, 8vw, 3.5rem);
      line-height: 1.05;
      color: var(--kei-blue-dark);
      margin-bottom: 12px;
    }
    p { color: var(--muted); font-size: 1.05rem; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/assets/img/logo.png" alt="Kei Events logo">
    <div class="tape" aria-hidden="true"></div>
    <h1>We're building something fun!</h1>
    <p class="lead">
      Our new website is under construction. Check back soon!
    </p>
  </main>
</body>
</html>
